# Gradle
# 标准库由 FLK 提供；编译基线在 gradle/kotlin-support.gradle 单独约束。
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx3G -Duser.language=en -Duser.country=US
# fabric-loom 要求 Gradle 守护进程 JVM >= 21；1.21.8 的客户端目标运行时是 Java 21
# （version json 的 javaVersion.majorVersion = 21，component = java-runtime-delta），
# 所以守护进程 / 编译 / runClient 统一用 JDK 21。
# 本机为 macOS：JDK 21 装在系统 JVM 目录下。
org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-21.jdk/Contents/Home

# Fabric Properties
minecraft_version=1.21.8
# 共享源码统一用 Mojang 官方名（mojmap），yarn 不再参与构建：
# Fabric 侧用 loom.officialMojangMappings()。
# 开发/编译期使用的 Loader 版本（保持较新，仅影响本地 runClient 与编译类路径）。
loader_version=0.19.3
# 运行期最低要求，写入 fabric.mod.json 的 depends.fabricloader。
# fabric-api 0.136.1+1.21.8 的根 fabric.mod.json 写 depends fabricloader >=0.17.0
# （与 0.130.0+ 同代要求），下限与 1.21.10 线一致。
loader_min_version=0.17.0
# Fabric 侧 Kotlin 运行时最低支持版本。
fabric_language_kotlin_version=1.13.12+kotlin.2.4.0

# Mod Properties
mod_version=2.6.0
maven_group=com.muoniumplayer
archives_base_name=MuoniumPlayer

# Dependencies
fabric_version=0.136.1+1.21.8

# 本机（macOS）网络事实（2026-11-21 实测）：maven.fabricmc.net / maven.aliyun.com /
# libraries.minecraft.net / piston-meta.mojang.com / maven.izzel.io 直连均可达
#（沙箱透明代理兜底），无需显式代理。不要照抄 Windows 车道的 7890 代理配置。
# 显式登记本机 JDK，避免 toolchain 自动探测失败。
org.gradle.java.installations.paths=/Library/Java/JavaVirtualMachines/jdk-21.jdk/Contents/Home
